<!doctype html>
<!-- lorlabs.dev moved to lorlabs.llc. Sends visitors to the same path on the new domain. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lor Labs LLC</title>
  <link rel="canonical" href="https://lorlabs.llc/">
  <meta http-equiv="refresh" content="0; url=https://lorlabs.llc/">
  <script>location.replace("https://lorlabs.llc" + location.pathname + location.search + location.hash);</script>
  <!-- Link-preview tags, so lorlabs.dev links still show the Lor Labs card in apps that don't follow redirects. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lorlabs.llc/">
  <meta property="og:site_name" content="Lor Labs LLC">
  <meta property="og:title" content="Lor Labs LLC">
  <meta property="og:description" content="Software for small to medium business. Inventory management, invoicing, reporting, and more.">
  <meta property="og:image" content="https://lorlabs.llc/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <p>Lor Labs has moved to <a href="https://lorlabs.llc/">lorlabs.llc</a>.</p>
</body>
</html>
